<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galtown</title>
<meta name="description" content="Le app per Android di Galtown.">
<style>
  :root {
    color-scheme: light;
    --sfondo: #f7f8f5;
    --testo: #1c2420;
    --tenue: #56635c;
    --panno: #1f5a43;
    --linea: #d3dad5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --sfondo: #0f1a15;
      --testo: #e4ebe7;
      --tenue: #9daba3;
      --panno: #86c9a6;
      --linea: #2b3b33;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--sfondo);
    color: var(--testo);
    font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, "Noto Serif", Georgia, serif;
    font-size: 1.0625rem;
    line-height: 1.6;
  }
  main { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { margin: 0 0 0.25rem; font-size: 2.25rem; line-height: 1.1; }
  .sotto { color: var(--tenue); margin: 0 0 2.5rem; }
  article { border-top: 1px solid var(--linea); padding-top: 1.25rem; display: grid; grid-template-columns: auto 1fr; column-gap: 1.25rem; align-items: start; }
  .numero { margin: 0; color: var(--panno); font-size: 3.5rem; font-weight: 700; line-height: 0.9; letter-spacing: -0.02em; }
  p { margin: 0 0 0.75rem; }
  a { color: var(--panno); text-underline-offset: 0.15em; }
  a:focus-visible { outline: 2px solid var(--panno); outline-offset: 2px; border-radius: 2px; }
  footer { margin-top: 3rem; color: var(--tenue); font-size: 0.95rem; }
</style>
</head>
<body>
<main>
  <h1>Galtown</h1>
  <p class="sotto">App per Android di Francesco Perrone. <span lang="en">Android apps by Francesco Perrone.</span></p>

  <article>
    <h2 class="numero">31</h2>
    <div>
      <p>Il gioco di carte del Salento, con il mazzo napoletano: contro l’IA o online con gli amici. Presto su Google Play.</p>
      <p><a href="31/privacy.html">Privacy policy</a></p>
    </div>
  </article>

  <footer>
    <p>Contatti / Contact: <a href="mailto:galtown.app@gmail.com">galtown.app@gmail.com</a></p>
  </footer>
</main>
</body>
</html>
